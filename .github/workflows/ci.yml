name: Checks
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: keitaro
          POSTGRES_PASSWORD: keitaro
          POSTGRES_DB: keitaro_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U keitaro -d keitaro_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -c requirements.lock -e '.[dev]'
      - run: ruff check app tests tools migrations
      - run: ruff format --check app tests tools migrations
      - run: pytest --cov=app --cov-report=term-missing
        env:
          TEST_DATABASE_URL: postgresql+psycopg://keitaro:keitaro@localhost:5432/keitaro_test
      - run: alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://keitaro:keitaro@localhost:5432/keitaro_test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - run: npm run build
      - run: npm audit --audit-level=high
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build app
